<svg width="200" height="200" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="braintool logo">
  <title>braintool</title>

  <!-- outer ring -->
  <circle cx="100" cy="100" r="82" stroke="#6366f1" stroke-opacity="0.25" stroke-width="2" stroke-dasharray="4 7"/>

  <!-- edges: every satellite reports to the centre -->
  <g stroke="#6366f1" stroke-opacity="0.55" stroke-width="2" stroke-linecap="round">
    <line x1="100" y1="100" x2="100" y2="34"/>
    <line x1="100" y1="100" x2="157" y2="67"/>
    <line x1="100" y1="100" x2="157" y2="133"/>
    <line x1="100" y1="100" x2="100" y2="166"/>
    <line x1="100" y1="100" x2="43"  y2="133"/>
    <line x1="100" y1="100" x2="43"  y2="67"/>
  </g>

  <!-- edges between neighbours: the graph, not just a star -->
  <g stroke="#818cf8" stroke-opacity="0.35" stroke-width="1.5" stroke-linecap="round">
    <line x1="100" y1="34"  x2="157" y2="67"/>
    <line x1="157" y1="133" x2="100" y2="166"/>
    <line x1="43"  y1="133" x2="43"  y2="67"/>
  </g>

  <!-- satellites: installed tools -->
  <g fill="#a5b4fc">
    <circle cx="100" cy="34"  r="9"/>
    <circle cx="157" cy="67"  r="9"/>
    <circle cx="157" cy="133" r="9"/>
    <circle cx="43"  cy="133" r="9"/>
    <circle cx="43"  cy="67"  r="9"/>
  </g>

  <!-- one satellite retired: the no, which is the valuable record -->
  <circle cx="100" cy="166" r="9" fill="none" stroke="#f43f5e" stroke-width="2.5" stroke-opacity="0.8"/>
  <line x1="95" y1="161" x2="105" y2="171" stroke="#f43f5e" stroke-width="2.5" stroke-opacity="0.8" stroke-linecap="round"/>

  <!-- the ledger at the centre -->
  <circle cx="100" cy="100" r="21" fill="#4f46e5"/>
  <g stroke="#e0e7ff" stroke-width="2.5" stroke-linecap="round">
    <line x1="91" y1="94"  x2="109" y2="94"/>
    <line x1="91" y1="100" x2="109" y2="100"/>
    <line x1="91" y1="106" x2="103" y2="106"/>
  </g>
</svg>
