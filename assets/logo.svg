<svg width="1280" height="440" viewBox="0 0 1280 440" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="braintool">
  <title>braintool</title>

  <defs>
    <radialGradient id="vignette" cx="0.5" cy="0.5" r="0.72">
      <stop offset="0" stop-color="#17171a"/>
      <stop offset="1" stop-color="#0a0a0c"/>
    </radialGradient>
    <filter id="bloom" x="-60%" y="-160%" width="220%" height="420%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="46"/>
    </filter>
  </defs>

  <rect width="1280" height="440" fill="url(#vignette)"/>

  <!-- the glow: one soft mass, cool on the left, violet on the right -->
  <g filter="url(#bloom)" opacity="0.92">
    <ellipse cx="898" cy="188" rx="124" ry="94" fill="#8b5cf6"/>
    <ellipse cx="824" cy="244" rx="112" ry="88" fill="#5b62d6"/>
    <ellipse cx="696" cy="234" rx="126" ry="96" fill="#5fb2c9"/>
    <ellipse cx="738" cy="206" rx="104" ry="78" fill="#cfe9f4"/>
    <ellipse cx="756" cy="212" rx="66" ry="50" fill="#eaf6fb"/>
  </g>

  <g fill="#ffffff" font-family="JetBrains Mono, SF Mono, Menlo, Monaco, Consolas, DejaVu Sans Mono, monospace" font-weight="500" font-size="76" letter-spacing="-1">
    <text x="620" y="242">braintool</text>
  </g>
</svg>
